<!--Adaptar esse codigo para o meu-->


<!-- Botões de Filtro -->
<div class="container text-center my-4">
  <button class="btn btn-primary btn-filtro" data-filter="todos">Todos</button>
  <button class="btn btn-outline-primary btn-filtro" data-filter="casa">Casas</button>
  <button class="btn btn-outline-primary btn-filtro" data-filter="apartamento">Apartamentos</button>
</div>

<!-- Lista de Imóveis -->
<div class="container">
  <div class="row" id="lista-imoveis">
    
    <!-- Card 1: Casa -->
    <div class="col-md-4 mb-4 item-imovel casa">
      <div class="card shadow-sm">
        <img src="casa1.jpg" class="card-img-top" alt="Casa Linda">
        <div class="card-body">
          <h5 class="card-title">Casa de Praia</h5>
          <p class="card-text">3 quartos, piscina e churrasqueira.</p>
          <span class="badge bg-success">Casa</span>
        </div>
      </div>
    </div>

    <!-- Card 2: Apartamento -->
    <div class="col-md-4 mb-4 item-imovel apartamento">
      <div class="card shadow-sm">
        <img src="ap1.jpg" class="card-img-top" alt="Ap Moderno">
        <div class="card-body">
          <h5 class="card-title">Apartamento no Centro</h5>
          <p class="card-text">2 quartos, suíte e 1 vaga de garagem.</p>
          <span class="badge bg-info text-dark">Apartamento</span>
        </div>
      </div>
    </div>

    <!-- Card 3: Casa -->
    <div class="col-md-4 mb-4 item-imovel casa">
      <div class="card shadow-sm">
        <img src="casa2.jpg" class="card-img-top" alt="Casa Campo">
        <div class="card-body">
          <h5 class="card-title">Casa de Campo</h5>
          <p class="card-text">Amplo quintal e área verde.</p>
          <span class="badge bg-success">Casa</span>
        </div>
      </div>
    </div>

  </div>
</div>
